<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar navigation -->
    <div class="sidebar">
      <button class="sidebarMain active" id="transactionsBtn" type="button">Transactions</button>

      <button class="sidebarMain" id="settingsBtn" type="button">Settings</button>

      <div id="settingsMenu" class="submenu hidden">
        <button class="submenuItem" type="button" onclick="notImplemented()">User management</button>
        <button class="submenuItem" type="button" onclick="notImplemented()">ATM management</button>
        <button class="submenuItem" type="button" onclick="notImplemented()">My account</button>
      </div>
    </div>

    <!-- Main page content -->
    <div class="main">
      <!-- Page header -->
      <div class="headerRow">
        <h1>All Transactions</h1>

        <div class="actions">
          <button type="button" onclick="notImplemented()">Print</button>
          <button type="button" onclick="notImplemented()">Export</button>
        </div>
      </div>

      <!-- Filter bar -->
      <div class="filtersBar">
        <!-- Date filter -->
        <div class="filterGroup dateFilterGroup">
          <label for="dateRange">DATE</label>

          <div class="dateInputWrap">
            <input type="text" id="dateRange" placeholder="All Dates" readonly>

            <span class="dateInlineIcon">
              <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="18" fill="none" stroke="black" stroke-width="2"></rect>
                <line x1="3" y1="10" x2="21" y2="10" stroke="black" stroke-width="2"></line>
                <line x1="8" y1="2" x2="8" y2="6" stroke="black" stroke-width="2"></line>
                <line x1="16" y1="2" x2="16" y2="6" stroke="black" stroke-width="2"></line>
              </svg>
            </span>

            <button type="button" id="clearDateBtn" class="clearDateBtn" aria-label="Clear date filter">×</button>
          </div>
        </div>

        <!-- ATM filter -->
        <div class="filterGroup dropdownFilter">
          <label>ATM ID</label>

          <button type="button" class="dropdownBtn" id="atmDropdownBtn">
            <!-- Button text is updated in JavaScript based on selected ATM values -->
            <span id="atmDropdownText">All ATMs</span>
            <span class="dropdownArrow">▼</span>
          </button>

          <div class="dropdownPanel hidden" id="atmDropdownPanel"></div>
        </div>

        <!-- PAN filter -->
        <div class="filterGroup">
          <label for="panFilter">CUSTOMER PAN NUMBER</label>
          <input type="text" id="panFilter" placeholder="Partial or full card number">
        </div>

        <!-- AID filter -->
        <div class="filterGroup dropdownFilter">
          <label>EMV CHIP AID</label>

          <button type="button" class="dropdownBtn" id="aidDropdownBtn">
            <span id="aidDropdownText">All applications</span>
            <span class="dropdownArrow">▼</span>
          </button>

          <div class="dropdownPanel hidden" id="aidDropdownPanel"></div>
        </div>

        <!-- Transaction Serial Number filter -->
        <div class="filterGroup">
          <label for="serialFilter">TRANSACTION SERIAL NUMBER</label>
          <input type="text" id="serialFilter" placeholder="4 digit number">
        </div>
      </div>

      <!-- Transactions table -->
      <table id="transactionsTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>ATM ID</th>
            <th>Customer PAN</th>
            <th>Description</th>
            <th class="codeHeader">
              <div class="codeHeaderRow">
                <span>Code</span>

                <div class="codeSearch">
                  <span class="searchInlineIcon">
                    <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="7" fill="none" stroke="black" stroke-width="2"></circle>
                      <line x1="16.65" y1="16.65" x2="21" y2="21" stroke="black" stroke-width="2"></line>
                    </svg>
                  </span>

                  <input type="text" id="searchInput" placeholder="Search in results">
                </div>
              </div>
            </th>
          </tr>
        </thead>

        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="script.js"></script>
</body>
</html>
